<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ระบบติดตามงานนักเรียน</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.08);text-align:center}
    h1{font-size:1.4rem;margin:0 0 10px} p{line-height:1.6;color:#475569}
    .dot{width:12px;height:12px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px}
    button{border:0;border-radius:12px;padding:12px 18px;font-size:1rem;cursor:pointer;background:#111827;color:white}
    small{display:block;margin-top:18px;color:#94a3b8}
  </style>
</head>
<body>
<main>
  <h1><span class="dot"></span>ระบบติดตามงานนักเรียน</h1>
  <p id="msg">กำลังเชื่อมต่อระบบ กรุณารอสักครู่…</p>
  <button id="retry" hidden>ลองอีกครั้ง</button>
  <small>Stable Gateway</small>
</main>
<script>
const msg=document.getElementById("msg");
const retry=document.getElementById("retry");
async function openTracker(){
  retry.hidden=true;
  msg.textContent="กำลังเชื่อมต่อระบบ กรุณารอสักครู่…";
  try{
    const r=await fetch("https://raw.githubusercontent.com/codebytoy/student-tracker-gateway/main/current-url.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("gateway unavailable");
    const d=await r.json();
    const u=new URL(d.url);
    if(u.protocol!=="https:" || !u.hostname.endsWith(".trycloudflare.com")) throw new Error("invalid target");
    msg.textContent="พบระบบแล้ว กำลังเปิด…";
    location.replace(u.href);
  }catch(e){
    msg.textContent="ยังเชื่อมต่อระบบไม่ได้ในขณะนี้ กรุณารอสักครู่แล้วลองใหม่";
    retry.hidden=false;
  }
}
retry.addEventListener("click",openTracker);
openTracker();
</script>
</body>
</html>
